<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traductor Selva Korpi</title>
  </head>
  <body>
    <main>
      <article>
        <h1>Traductor Selva Korpi</h1>
      </article>
      <section class="boxes">
        <label for="original">Texto a traducir:</label>
        <textarea name="original" id="original-text" rows="10" cols="40" placeholder="Ingresa el texto que deseas traducir a Selva Korpi."></textarea>
        <label for="translated">Toxte on Korpi Selva: </label>
        <textarea name="translated" id="translated-text" rows="10" cols="40"></textarea>
      </section>
    </main>
  </body>
</html>
