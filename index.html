<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traductor Selva Korpi</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <main>
      <article>
        <h1>Traductor Selva Korpi</h1>
      </article>
      <section class="boxes">
        <label for="original"><h2>Texto a traducir:</h2></label>
        <textarea
          name="original"
          id="original-text"
          rows="20"
          cols="40"
          placeholder="Ingresa el texto que deseas traducir a Selva Korpi."
        ></textarea>
        <label for="translated"><h2>Toxte on Korpi Selva:</h2></label>
        <textarea
          name="translated"
          id="translated-text"
          rows="20"
          cols="40"
        ></textarea>
        <button type="button" class="copy-button" id="copy">C o p y</button>
      </section>
    </main>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="assets/script.js"></script>
  </body>
</html>
